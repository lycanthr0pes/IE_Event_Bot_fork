[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ie-event-bot"
version = "0.1.0"
description = "Discord, Google Calendar, and Notion integration bot"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
  "pyright==1.1.411",
  "ruff==0.15.10",
  "pytest==9.0.3",
]

[tool.setuptools]
packages = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"workers/src/entry.py" = ["F401"]
